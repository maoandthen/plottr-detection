<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ownership Map · Tenure by Plottr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --ink:#0f0f0d;--paper:#f5f2eb;--warm:#ede9df;--rule:#d4cfc4;
 --navy:#1a2c4a;--gold:#b8972a;--red:#b52d1e;--amber:#c97b12;--green:#2a5c3f;
 --c0:#1e2d3d;--c1:#1a3d2a;--c2:#1a5c2a;--c3:#1e7a2a;--c4:#28a035;--c5:#5dd464;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}

/* ── MASTHEAD ── */
.mh{height:46px;border-bottom:1px solid rgba(245,242,235,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;background:rgba(15,15,13,0.97);position:relative;z-index:200}
.logo{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--paper);text-decoration:none}
.logo em{font-style:italic;color:var(--gold)}
.mh-mid{display:flex;align-items:center;gap:0.6rem}
.search-box{display:flex;align-items:center;background:rgba(245,242,235,0.06);border:1px solid rgba(245,242,235,0.12);padding:0.3rem 0.6rem;gap:0.4rem}
.search-box input{background:none;border:none;outline:none;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--paper);width:160px;letter-spacing:0.04em}
.search-box input::placeholder{color:rgba(245,242,235,0.25)}
.go-btn{background:var(--gold);color:var(--ink);border:none;padding:0.28rem 0.6rem;font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;cursor:pointer}
.vtog{display:flex;border:1px solid rgba(245,242,235,0.15)}
.vb{background:none;border:none;border-right:1px solid rgba(245,242,235,0.15);color:rgba(245,242,235,0.35);font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.28rem 0.65rem;cursor:pointer;transition:all 0.12s}
.vb:last-child{border-right:none}
.vb.on{background:rgba(245,242,235,0.1);color:var(--paper)}
.mh-right{display:flex;align-items:center;gap:0.8rem;font-family:'DM Mono',monospace;font-size:0.62rem;color:rgba(245,242,235,0.35)}
.live{width:6px;height:6px;border-radius:50%;background:#5dd464;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── STATUSBAR ── */
.sb{height:30px;border-bottom:1px solid rgba(245,242,235,0.07);display:flex;align-items:center;padding:0 1rem;gap:1.5rem;font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.06em;color:rgba(245,242,235,0.3);background:rgba(15,15,13,0.5)}
.sb strong{color:rgba(245,242,235,0.75);font-weight:400}
.trail{margin-left:auto;display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap}
.trail-item{display:flex;align-items:center;background:rgba(245,242,235,0.06);border:1px solid rgba(245,242,235,0.12);border-radius:3px;padding:0.2rem 0.5rem;gap:0.4rem;font-size:0.58rem;transition:all 0.12s;max-width:120px}
.trail-item:hover{background:rgba(245,242,235,0.1);border-color:rgba(245,242,235,0.2)}
.trail-label{cursor:pointer;color:rgba(245,242,235,0.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.trail-label:hover{color:var(--paper)}
.trail-close{cursor:pointer;color:rgba(245,242,235,0.3);font-size:0.7rem;line-height:1;padding:0.1rem;border-radius:1px;display:flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0}
.trail-close:hover{color:var(--red);background:rgba(181,45,30,0.1)}
.ts{opacity:0.3;margin:0 0.2rem;color:rgba(245,242,235,0.3)}
@media (max-width: 768px) {
  .trail{gap:0.2rem}
  .trail-item{padding:0.15rem 0.4rem;font-size:0.55rem;max-width:100px}
  .trail-close{width:12px;height:12px;font-size:0.65rem}
}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - 76px);position:relative}
.canvas{flex:1;position:relative;overflow:hidden}
#svg-tm,#svg-net{position:absolute;inset:0;width:100%;height:100%}
#svg-net{display:none}

/* ── TABLE VIEW ── */
#tbl-view{display:none;position:absolute;inset:0;overflow-y:auto;padding:1rem}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,242,235,0.35);text-align:left;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(245,242,235,0.1);font-weight:400;white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:hover{color:rgba(245,242,235,0.7)}
.tbl th.sort-asc::after{content:' ↑'}
.tbl th.sort-desc::after{content:' ↓'}
.tbl td{padding:0.55rem 0.8rem;border-bottom:1px solid rgba(245,242,235,0.06);vertical-align:middle}
.tbl tr{cursor:pointer;transition:background 0.1s}
.tbl tr:hover td{background:rgba(245,242,235,0.04)}
.tbl .ent-name{font-size:0.8rem;font-weight:500;color:var(--paper);margin-bottom:0.1rem}
.tbl .ent-crn{font-family:'DM Mono',monospace;font-size:0.6rem;color:rgba(245,242,235,0.3)}
.heat-pill{display:inline-block;width:32px;height:6px;border-radius:1px;vertical-align:middle}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.1rem 0.35rem;border:1px solid currentColor;border-radius:1px;margin-right:0.2rem}
.b-os{color:var(--gold)}
.b-adm{color:var(--amber)}
.b-liq{color:var(--red)}
.b-ok{color:rgba(245,242,235,0.2)}
.num{font-family:'DM Mono',monospace;font-size:0.75rem;font-weight:400}

/* ── SIDE PANEL ── */
.panel{position:absolute;top:0;right:0;width:400px;height:100%;background:#0d0d0b;border-left:1px solid rgba(245,242,235,0.1);transform:translateX(100%);transition:transform 0.25s cubic-bezier(0.22,1,0.36,1);overflow-y:auto;z-index:100}
.panel.open{transform:translateX(0)}
.panel-close{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1rem;border-bottom:1px solid rgba(245,242,235,0.08);background:#0d0d0b}
.panel-close-btn{background:none;border:none;color:rgba(245,242,235,0.3);cursor:pointer;font-size:1rem;line-height:1;transition:color 0.1s}
.panel-close-btn:hover{color:var(--paper)}
.panel-label{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,242,235,0.25)}
.panel-body{padding:1.2rem 1rem}
.panel-name{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:400;line-height:1.25;margin-bottom:0.5rem;color:var(--paper)}
.panel-crn{font-family:'DM Mono',monospace;font-size:0.65rem;color:rgba(245,242,235,0.3);letter-spacing:0.06em;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.6rem}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-active{background:#5dd464}
.dot-dissolved{background:var(--red)}
.dot-admin{background:var(--amber)}
.dot-other{background:rgba(245,242,235,0.3)}

/* Panel sections */
.psec{margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid rgba(245,242,235,0.07)}
.psec:last-child{border-bottom:none}
.psec-head{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,242,235,0.3);margin-bottom:0.7rem}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem}
.stat-box{background:rgba(245,242,235,0.04);padding:0.6rem 0.7rem;border:1px solid rgba(245,242,235,0.07)}
.stat-val{font-family:'Playfair Display',serif;font-size:1.2rem;display:block;line-height:1;margin-bottom:0.2rem;color:var(--paper)}
.stat-lbl{font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.08em;text-transform:uppercase;color:rgba(245,242,235,0.3)}

/* Flags */
.flags{display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.8rem}
.flag{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.2rem 0.5rem;border:1px solid currentColor}
.fl-high{color:var(--red)}
.fl-med{color:var(--amber)}
.fl-info{color:var(--gold)}
.fl-ok{display:none}

/* PSC list */
.psc-item{padding:0.55rem 0;border-bottom:1px solid rgba(245,242,235,0.06);cursor:pointer;transition:background 0.1s}
.psc-item:hover{background:rgba(245,242,235,0.03);margin:0 -0.5rem;padding:0.55rem 0.5rem}
.psc-item:last-child{border-bottom:none}
.psc-name{font-size:0.8rem;font-weight:500;color:var(--paper);margin-bottom:0.15rem}
.psc-meta{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(245,242,235,0.3);letter-spacing:0.04em}

/* Siblings */
.sib-item{padding:0.5rem 0;border-bottom:1px solid rgba(245,242,235,0.06);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;transition:background 0.1s}
.sib-item:hover{background:rgba(245,242,235,0.03);margin:0 -0.5rem;padding:0.5rem 0.5rem}
.sib-item:last-child{border-bottom:none}
.sib-name{font-size:0.78rem;color:var(--paper);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sib-count{font-family:'DM Mono',monospace;font-size:0.65rem;color:rgba(245,242,235,0.35);flex-shrink:0}

/* CTA buttons */
.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.cta-btn{background:none;border:1px solid rgba(245,242,235,0.15);color:rgba(245,242,235,0.6);font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.6rem 0.5rem;cursor:pointer;text-align:center;transition:all 0.15s;text-decoration:none;display:block}
.cta-btn:hover{border-color:var(--gold);color:var(--gold)}
.cta-btn.primary{grid-column:span 2;border-color:var(--gold);color:var(--gold)}
.cta-btn.primary:hover{background:var(--gold);color:var(--ink)}

/* Loading */
.panel-loading{padding:2rem;text-align:center;font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,242,235,0.25)}

/* Legend */
.legend{position:absolute;bottom:1rem;left:1rem;background:rgba(13,13,11,0.9);border:1px solid rgba(245,242,235,0.1);padding:0.7rem 0.9rem;z-index:50;pointer-events:none}
.leg-title{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,242,235,0.3);margin-bottom:0.5rem}
.heat-bar{width:90px;height:6px;background:linear-gradient(to right,var(--c0),var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));margin-bottom:0.2rem}
.heat-labs{display:flex;justify-content:space-between;width:90px}
.heat-lab{font-family:'DM Mono',monospace;font-size:0.5rem;color:rgba(245,242,235,0.25)}
.leg-items{margin-top:0.5rem;display:flex;flex-direction:column;gap:0.25rem}
.leg-row{display:flex;align-items:center;gap:0.4rem;font-family:'DM Mono',monospace;font-size:0.55rem;color:rgba(245,242,235,0.3)}
.leg-sw{width:8px;height:8px;flex-shrink:0}

/* Tooltip */
.tip{position:fixed;background:rgba(13,13,11,0.97);border:1px solid rgba(245,242,235,0.12);padding:0.6rem 0.8rem;pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:300;max-width:240px}
.tip.on{opacity:1}
.tip-name{font-size:0.78rem;font-weight:500;margin-bottom:0.2rem;line-height:1.3}
.tip-sub{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(245,242,235,0.35);letter-spacing:0.04em}
.tip-hint{margin-top:0.4rem;font-family:'DM Mono',monospace;font-size:0.55rem;color:rgba(245,242,235,0.2)}

/* Loading overlay */
.load-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.8rem;background:var(--ink);z-index:80;transition:opacity 0.3s}
.load-txt{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,242,235,0.3)}
.load-bar{width:180px;height:1px;background:rgba(245,242,235,0.08);position:relative;overflow:hidden}
.load-bar::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--gold);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%{left:-100%}100%{left:100%}}
</style>

</head>
<body>

<header class="mh">
 <a class="logo" href="/">ten<em>ure</em></a>
 <div class="mh-mid">
 <div class="search-box">
 <input type="text" id="ai" placeholder="Postcode or area…" value="SW1X">
 <button class="go-btn" onclick="loadArea()">→</button>
 </div>
 <div class="vtog">
 <button class="vb on" id="vb-tm" onclick="setView('tm')">Treemap</button>
 <button class="vb" id="vb-net" onclick="setView('net')">Network</button>
 <button class="vb" id="vb-tbl" onclick="setView('tbl')">Table</button>
 </div>
 </div>
 <div class="mh-right">
 <span class="live"></span>
 <span id="mh-stat">—</span>
 </div>
</header>

<div class="sb">
 <span>Area: <strong id="sb-a">—</strong></span>
 <span>Titles: <strong id="sb-t">—</strong></span>
 <span>Corporate: <strong id="sb-c">—</strong></span>
 <span>Overseas: <strong id="sb-f">—</strong></span>
 <div class="trail" id="trail"></div>
</div>

<div class="layout">
 <div class="canvas" id="canvas"><div class="load-ov" id="lov"><div class="load-txt">Querying ownership graph…</div><div class="load-bar"></div></div>
 <svg id="svg-tm"></svg>
 <svg id="svg-net"></svg>
 <div id="tbl-view">
 <table class="tbl" id="tbl">
 <thead><tr>
 <th onclick="sortTbl('name')">Company</th>
 <th onclick="sortTbl('title_count')">Titles</th>
 <th onclick="sortTbl('heat')">Heat</th>
 <th>Type</th>
 <th>Status</th>
 </tr></thead>
 <tbody id="tbl-body"></tbody>
 </table>
 </div>
 <div class="legend" id="legend">
 <div class="leg-title">Connectivity</div>
 <div class="heat-bar"></div>
 <div class="heat-labs"><span class="heat-lab">Low</span><span class="heat-lab">High</span></div>
 <div class="leg-items">
 <div class="leg-row"><div class="leg-sw" style="background:rgba(184,151,42,0.4)"></div>Overseas entity</div>
 <div class="leg-row"><div class="leg-sw" style="background:rgba(181,45,30,0.4)"></div>Admin / Liquidation</div>
 <div class="leg-row"><div class="leg-sw" style="background:rgba(245,242,235,0.15)"></div>Size = title count</div>
 </div>
 </div>
 </div>

 <!-- SIDE PANEL -->

 <div class="panel" id="panel">
 <div class="panel-close">
 <span class="panel-label">Company profile</span>
 <button class="panel-close-btn" onclick="closePanel()">×</button>
 </div>
 <div class="panel-body" id="panel-body">
 <div class="panel-loading">Select a company to explore</div>
 </div>
 </div>
</div>

<div class="tip" id="tip">
 <div class="tip-name" id="tn"></div>
 <div class="tip-sub" id="ts"></div>
 <div class="tip-hint">Click to open profile →</div>
</div>

<script>
// ── STATE ──
let data = null, view = 'tm', sortCol = 'title_count', sortDir = -1, trail = [];

// ── HEAT ──
function heat(d) {
 let s = Math.log((d.title_count||0) + 1) * 10;
 if (d.foreign) s += 8;
 if (d.status === 'Active') s += 5;
 if (d.status && /Admin|Liquid/.test(d.status)) s = 2;
 return Math.min(s, 100);
}

function heatCol(s) {
 const stops = [[30,45,61],[26,61,42],[26,92,42],[30,122,42],[40,160,53],[93,212,100]];
 const t = s / 100;
 const i = Math.min(Math.floor(t * 5), 4);
 const f = t * 5 - i;
 const a = stops[i], b = stops[i+1];
 return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}

function fillCol(d) {
 if (d.status && /Admin|Liquid/.test(d.status)) return 'rgba(181,45,30,0.4)';
 if (d.foreign) return 'rgba(184,151,42,0.3)';
 return heatCol(heat(d));
}

// ── DATA ──
async function loadArea(area) {
 area = (area || document.getElementById('ai').value.trim()).toUpperCase() || 'SW1X';
 document.getElementById('ai').value = area;
 show('lov');
 try {
 const r = await fetch(`/api/concentration/${encodeURIComponent(area)}`);
 data = await r.json();
 data.owners = (data.owners || data.top_owners || []).map(o => ({ ...o, heat: heat(o) }));
 updateSB(area);
 addTrail(area, () => loadArea(area));
 render();
 } catch(e) {
 document.getElementById('mh-stat').textContent = 'Error: ' + e.message;
 } finally {
 hide('lov');
 }
}

function updateSB(area) {
 const s = data.stats || {};
 document.getElementById('sb-a').textContent = area;
 document.getElementById('sb-t').textContent = (s.total_titles||0).toLocaleString();
 document.getElementById('sb-c').textContent = (s.corporate_pct||0).toFixed(1) + '%';
 document.getElementById('sb-f').textContent = (s.foreign_pct||0).toFixed(1) + '%';
 document.getElementById('mh-stat').textContent = (data.owners||[]).length + ' entities';
}

// ── VIEWS ──
function setView(v) {
 view = v;
 ['tm','net','tbl'].forEach(x => {
 document.getElementById('vb-'+x).classList.toggle('on', x===v);
 });
 document.getElementById('svg-tm').style.display = v==='tm' ? 'block' : 'none';
 document.getElementById('svg-net').style.display = v==='net' ? 'block' : 'none';
 document.getElementById('tbl-view').style.display = v==='tbl' ? 'block' : 'none';
 document.getElementById('legend').style.display = v==='tbl' ? 'none' : 'block';
 if (data) render();
}

function render() {
 if (view === 'tm') renderTM();
 else if (view === 'net') renderNet();
 else renderTbl();
}

// ── TREEMAP ──
function renderTM() {
 const svg = d3.select('#svg-tm');
 svg.selectAll('*').remove();
 const W = svg.node().clientWidth, H = svg.node().clientHeight;
 svg.attr('width', W).attr('height', H);
 const owners = (data.owners||[]).filter(o => o.title_count > 0);
 if (!owners.length) return;

 const root = d3.hierarchy({ name:'root', children: owners.map(o=>({...o,value:o.title_count})) })
 .sum(d=>d.value).sort((a,b)=>b.value-a.value);
 d3.treemap().size([W,H]).padding(2).paddingOuter(3)(root);

 const rw = d => Math.max(0, d.x1-d.x0), rh = d => Math.max(0, d.y1-d.y0);

 const cell = svg.selectAll('g').data(root.leaves()).join('g')
 .attr('transform', d=>`translate(${d.x0},${d.y0})`)
 .style('cursor','pointer')
 .on('mousemove',(e,d)=>tip(e,d.data))
 .on('mouseleave', hideTip)
 .on('click',(e,d)=>{e.preventDefault();e.stopPropagation();openPanel(d.data);});

 cell.append('rect').attr('width',rw).attr('height',rh).attr('rx',1)
 .attr('fill', d=>fillCol(d.data));
 cell.append('rect').attr('width',rw).attr('height',rh).attr('rx',1)
 .attr('fill','none')
 .attr('stroke', d=>d.data.foreign?'rgba(184,151,42,0.35)':'rgba(245,242,235,0.05)')
 .attr('stroke-width',1);

 cell.filter(d=>rw(d)>55&&rh(d)>32)
 .append('foreignObject').attr('x',5).attr('y',5)
 .attr('width',d=>rw(d)-10).attr('height',d=>rh(d)-10)
 .append('xhtml:div')
 .style('font-family',"'DM Sans',sans-serif")
 .style('font-size',d=>rw(d)>130?'0.75rem':'0.62rem')
 .style('font-weight','500').style('color','rgba(245,242,235,0.88)')
 .style('line-height','1.2').style('overflow','hidden').style('height','100%')
 .text(d=>d.data.name);

 cell.filter(d=>rw(d)>40&&rh(d)>44)
 .append('text').attr('x',d=>rw(d)-5).attr('y',d=>rh(d)-7)
 .attr('text-anchor','end').attr('fill','rgba(245,242,235,0.4)')
 .attr('font-family',"'DM Mono',monospace").attr('font-size','0.58rem')
 .text(d=>d.data.title_count);

 cell.on('mouseenter',function(e,d){
 d3.select(this).select('rect').transition().duration(60)
 .attr('fill', d2=>heatCol(Math.min(heat(d2.data)+18,100)));
 }).on('mouseleave',function(e,d){
 d3.select(this).select('rect').transition().duration(100)
 .attr('fill',d2=>fillCol(d2.data));
 hideTip();
 });

 cell.style('opacity',0).transition().duration(350).delay((_,i)=>i*6).style('opacity',1);
}

// ── NETWORK ──
function renderNet() {
 const svg = d3.select('#svg-net');
 svg.selectAll('*').remove();
 const W = svg.node().clientWidth, H = svg.node().clientHeight;
 svg.attr('width',W).attr('height',H);
 const owners = (data.owners||[]).slice(0,50);
 const nodes = owners.map(o=>({...o, id:o.crn||o.name, r:Math.max(7,Math.min(38,Math.sqrt(o.title_count)*5))}));
 const links = nodes.length>1 ? nodes.slice(1,Math.min(10,nodes.length)).map(n=>({source:nodes[0].id,target:n.id})) : [];

 const sim = d3.forceSimulation(nodes)
 .force('link',d3.forceLink(links).id(d=>d.id).distance(130).strength(0.25))
 .force('charge',d3.forceManyBody().strength(d=>-d.r*9))
 .force('center',d3.forceCenter(W/2,H/2))
 .force('collide',d3.forceCollide(d=>d.r+5));

 const g = svg.append('g');
 svg.call(d3.zoom().scaleExtent([0.15,5]).on('zoom',e=>g.attr('transform',e.transform)));

 const link = g.append('g').selectAll('line').data(links).join('line')
 .attr('stroke','rgba(245,242,235,0.07)').attr('stroke-width',1);

 const node = g.append('g').selectAll('g').data(nodes).join('g')
 .style('cursor','pointer')
 .call(d3.drag()
 .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
 .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
 .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
 .on('mousemove',(e,d)=>tip(e,d))
 .on('mouseleave',hideTip)
 .on('click',(e,d)=>{e.preventDefault();e.stopPropagation();openPanel(d);});

 node.append('circle').attr('r',d=>d.r)
 .attr('fill',d=>fillCol(d))
 .attr('stroke',d=>heatCol(Math.min(heat(d)+20,100)))
 .attr('stroke-width',1.5);

 node.filter(d=>d.r>14).append('text').attr('text-anchor','middle').attr('dy','0.35em')
 .attr('fill','rgba(245,242,235,0.8)').attr('font-family',"'DM Sans',sans-serif")
 .attr('font-size',d=>d.r>26?'0.62rem':'0.52rem').attr('font-weight','500')
 .text(d=>d.name.split(' ')[0]);

 node.filter(d=>d.r>22).append('text').attr('text-anchor','middle').attr('dy','1.5em')
 .attr('fill','rgba(245,242,235,0.3)').attr('font-family',"'DM Mono',monospace")
 .attr('font-size','0.5rem').text(d=>d.title_count+' titles');

 sim.on('tick',()=>{
 link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
 .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
 node.attr('transform',d=>`translate(${d.x},${d.y})`);
 });
}

// ── TABLE ──
function renderTbl() {
 const owners = [...(data.owners||[])];
 owners.sort((a,b) => sortDir * (sortCol==='name' ? a.name.localeCompare(b.name) : ((a[sortCol]||0)-(b[sortCol]||0))));

 document.querySelectorAll('.tbl th').forEach(th => {
 th.classList.remove('sort-asc','sort-desc');
 if (th.textContent.toLowerCase().includes(sortCol.replace('_count',''))) {
 th.classList.add(sortDir>0?'sort-asc':'sort-desc');
 }
 });

 document.getElementById('tbl-body').innerHTML = owners.map(o => {
 const h = heat(o);
 const hc = heatCol(h);
 const badges = [];
 if (o.foreign) badges.push('<span class="badge b-os">Overseas</span>');
 if (o.status && o.status.includes('Admin')) badges.push('<span class="badge b-adm">Admin</span>');
 if (o.status && o.status.includes('Liquid')) badges.push('<span class="badge b-liq">Liq.</span>');
 return `<tr onclick="event.preventDefault();event.stopPropagation();openPanel(${JSON.stringify(o).replace(/"/g,'&quot;')})">
 <td><div class="ent-name">${o.name}</div><div class="ent-crn">${o.crn||'Overseas'}</div></td>
 <td class="num">${o.title_count}</td>
 <td><div class="heat-pill" style="background:${hc}"></div></td>
 <td>${badges.join('')||'<span class="badge b-ok">UK Ltd</span>'}</td>
 <td style="font-size:0.72rem;color:rgba(245,242,235,0.5)">${o.status||'—'}</td>
 </tr>`;
 }).join('');
}

function sortTbl(col) {
 if (sortCol===col) sortDir *= -1;
 else { sortCol=col; sortDir=-1; }
 renderTbl();
}

// ── PANEL ──
async function openPanel(d) {
 const panel = document.getElementById('panel');
 const body = document.getElementById('panel-body');

 addTrail((d.name||'').split(' ')[0]+'…', ()=>openPanel(d));

 panel.classList.add('open');
 body.innerHTML = '<div class="panel-loading">Loading company profile…</div>';

 if (!d.crn) {
 body.innerHTML = renderBasicPanel(d);
 return;
 }

 try {
 const r = await fetch(`/api/company/${encodeURIComponent(d.crn)}`);
 const c = await r.json();
 if (c.error) throw new Error(c.error);
 body.innerHTML = renderFullPanel(c);
 } catch(e) {
 body.innerHTML = renderBasicPanel(d) + `<p style="color:rgba(245,242,235,0.25);font-size:0.7rem;margin-top:1rem">Extended data unavailable: ${e.message}</p>`;
 }
}

function closePanel() {
 document.getElementById('panel').classList.remove('open');
}

function renderBasicPanel(d) {
 const h = heat(d);
 return `
 <div class="panel-name">${d.name}</div>
 <div class="panel-crn">
 <span class="status-dot ${statusDotClass(d.status)}"></span>
 ${d.crn ? 'CH '+d.crn : 'Overseas entity'} · ${d.status||'—'}
 </div>
 <div class="psec">
 <div class="psec-head">Overview</div>
 <div class="stats-grid">
 <div class="stat-box"><span class="stat-val">${d.title_count}</span><span class="stat-lbl">Titles held</span></div>
 <div class="stat-box"><span class="stat-val">${Math.round(h)}</span><span class="stat-lbl">Heat score</span></div>
 <div class="stat-box"><span class="stat-val">${d.foreign?'OS':'UK'}</span><span class="stat-lbl">Jurisdiction</span></div>
 </div>
 </div>`;
}

function renderFullPanel(c) {
 const flagsHtml = c.flags.length
 ? c.flags.map(f=>`<span class="flag fl-${f.level==='high'||f.level==='critical'?'high':'med'}">${f.label}</span>`).join('')
 : '<span style="font-family:\'DM Mono\',monospace;font-size:0.6rem;color:rgba(245,242,235,0.2)">No flags · Clean</span>';

 const pscsHtml = c.pscs.length
 ? c.pscs.map(p=>`
 <div class="psc-item" onclick="openPersonPanel('${p.person_id}','${(p.name||'').replace(/'/g,"\\'")}')">
 <div class="psc-name">${p.name||'Unknown'}</div>
 <div class="psc-meta">${p.nationality||''} · Born ${p.dob_year||'—'} · ${(p.nature_of_control||'').split('-').slice(0,3).join(' ')}</div>
 </div>`).join('')
 : '<div style="font-family:\'DM Mono\',monospace;font-size:0.62rem;color:rgba(245,242,235,0.2);padding:0.3rem 0">No PSC persons found</div>';

 const sibsHtml = c.siblings.length
 ? c.siblings.map(s=>`
 <div class="sib-item" onclick="openPanel(${JSON.stringify(s).replace(/"/g,"'")})">
 <div class="sib-name">${s.name}</div>
 <div class="sib-count">${s.title_count} titles →</div>
 </div>`).join('')
 : '<div style="font-family:\'DM Mono\',monospace;font-size:0.62rem;color:rgba(245,242,235,0.2);padding:0.3rem 0">No linked companies found</div>';

 const districts = (c.districts||[]).join(', ') || '—';
 const postcodes = (c.postcodes||[]).join(' · ') || '—';

 return `
 <div class="panel-name">${c.name}</div>
 <div class="panel-crn">
 <span class="status-dot ${statusDotClass(c.status)}"></span>
 CH ${c.crn} · ${c.status||'—'} · Inc. ${c.incorporated||'—'}
 </div>
 <div class="flags">${flagsHtml}</div>

 <div class="psec">
 <div class="psec-head">Holdings</div>
 <div class="stats-grid">
 <div class="stat-box"><span class="stat-val">${c.title_count}</span><span class="stat-lbl">Titles</span></div>
 <div class="stat-box"><span class="stat-val">${(c.districts||[]).length}</span><span class="stat-lbl">Districts</span></div>
 <div class="stat-box"><span class="stat-val">${c.pscs.length}</span><span class="stat-lbl">PSC persons</span></div>
 </div>
 <div style="margin-top:0.6rem;font-family:'DM Mono',monospace;font-size:0.62rem;color:rgba(245,242,235,0.3)">
 <div style="margin-bottom:0.2rem">Districts: ${districts}</div>
 <div>Postcodes: ${postcodes}</div>
 ${c.address_postcode?`<div>Reg. office postcode: ${c.address_postcode}</div>`:''}
 </div>
 </div>

 <div class="psec">
 <div class="psec-head">Persons of significant control (${c.pscs.length})</div>
 ${pscsHtml}
 </div>

 <div class="psec">
 <div class="psec-head">Linked companies via shared PSC (${c.siblings.length})</div>
 ${sibsHtml}
 </div>

 <div class="psec">
 <div class="psec-head">Explore further</div>
 <div class="cta-grid">
 <a class="cta-btn primary" href="/api/company/${c.crn}" target="_blank">View API data →</a>
 <button class="cta-btn" onclick="loadArea('${(c.postcodes||[])[0]||''}')">Search this postcode</button>
 <button class="cta-btn" onclick="alert('Map drill-down coming Tuesday')">Map this estate</button>
 <button class="cta-btn" onclick="alert('Ownership trace coming Tuesday')">Trace UBO →</button>
 </div>
 </div>`;
}

async function openPersonPanel(personId, name) {
 const body = document.getElementById('panel-body');
 addTrail(name.split(' ')[0], ()=>openPersonPanel(personId,name));
 body.innerHTML = `<div class="panel-loading">Loading person profile for ${name}…</div>
 <div style="padding:1rem;font-family:'DM Mono',monospace;font-size:0.65rem;color:rgba(245,242,235,0.25)">
 Person profiles launch Tuesday — will show all companies controlled, total titles, and network connections.
 </div>`;
}

function statusDotClass(s) {
 if (!s) return 'dot-other';
 if (s==='Active') return 'dot-active';
 if (/Dissolved|Liquid/.test(s)) return 'dot-dissolved';
 if (/Admin/.test(s)) return 'dot-admin';
 return 'dot-other';
}

// ── TRAIL ──
function addTrail(label, action) {
 if (trail.length && trail[trail.length-1].label===label) return;
 trail.push({label,action});
 if (trail.length>6) trail.shift();
 renderTrail();
}

function renderTrail() {
 document.getElementById('trail').innerHTML = trail.map((t,i)=> {
   const isLast = i === trail.length - 1;
   return `<div class="trail-item">
     <span class="trail-label" onclick="jumpTrail(${i})" title="${t.label}">${t.label}</span>
     <span class="trail-close" onclick="closeTrail(${i})" title="Remove">×</span>
   </div>${!isLast ? '<span class="ts">›</span>' : ''}`;
 }).join('');
}

function closeTrail(i) {
 trail.splice(i, 1);
 renderTrail();
}

function jumpTrail(i) {
 trail = trail.slice(0,i+1);
 renderTrail();
 trail[i].action();
}

// ── TOOLTIP ──
function tip(e, d) {
 const t = document.getElementById('tip');
 document.getElementById('tn').textContent = d.name;
 document.getElementById('ts').textContent = `${d.title_count} titles · Heat ${Math.round(heat(d))} · ${d.crn||'Overseas'}`;
 const x = Math.min(e.clientX+14, window.innerWidth-260);
 const y = Math.min(e.clientY-8, window.innerHeight-100);
 t.style.left=x+'px'; t.style.top=y+'px'; t.classList.add('on');
}
function hideTip() { document.getElementById('tip').classList.remove('on'); }

// ── UTILS ──
function show(id){document.getElementById(id).style.opacity='1';document.getElementById(id).style.pointerEvents='all'}
function hide(id){document.getElementById(id).style.opacity='0';document.getElementById(id).style.pointerEvents='none'}

// ── INIT ──
document.getElementById('ai').addEventListener('keydown',e=>e.key==='Enter'&&loadArea());
window.addEventListener('resize',()=>data&&render());

const p = new URLSearchParams(window.location.search);
const init = p.get('area')||'SW1X';
document.getElementById('ai').value = init;
loadArea(init);
</script>
